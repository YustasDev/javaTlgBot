version: '3.8'

services:

  db:
    image: postgres:16-bullseye
    container_name: db_javaBot
    environment:
      POSTGRES_DB: infoBot
      POSTGRES_USER: postgres_1
      POSTGRES_PASSWORD: ${DB_postgres}
    volumes:
      - ./DB_infoBot/infoBot:/var/lib/postgresql/data
    # backend runs in host network, so it reaches the DB via localhost
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - boto_net
    restart: always

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_1 -d infoBot"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: 009123/tlg_bot:3.1
    container_name: javabot
    environment:
      HOST: db_javaBot
      PORT: 5432
      DB: infoBot
      DB_HOST: 127.0.0.1
      ENCRYPTION_PASSWORD: ${ENCRYPTION_PASSWORD}
    # Telegram IPv4 addresses are unreachable from the server, IPv6 works.
    # Host network gives the container IPv6; api.telegram.org is pinned to its
    # IPv6 address so other services (e.g. cbr-xml-daily.ru, broken over IPv6) stay on IPv4.
    network_mode: host
    extra_hosts:
      - "api.telegram.org:2001:67c:4e8:f004::9"
    restart: always
    depends_on:
       db:
         condition: service_healthy

networks:
  boto_net:
    name: boto_net
